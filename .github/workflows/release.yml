name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Test and build share packages
        shell: pwsh
        run: |
          $version = (Get-Content .\VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag must match VERSION.' }
          .\scripts\build-github-share.ps1

      - name: Create GitHub Release and upload package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content .\VERSION -Raw).Trim()
          $bundle = Join-Path .\dist "github-share-v$version"
          $assetPaths = @(
            (Join-Path $bundle "codex-usage-monitor-windows-$version.zip"),
            (Join-Path $bundle "codex-usage-monitor-windows-$version-source.zip"),
            (Join-Path $bundle 'SHA256SUMS.txt')
          )
          foreach ($asset in $assetPaths) { if (-not (Test-Path -LiteralPath $asset)) { throw "Release asset missing: $asset" } }
          $releaseTags = @(gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName | ConvertFrom-Json | ForEach-Object { $_.tagName })
          if ($releaseTags -contains $tag) {
            gh release upload $tag @assetPaths --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @assetPaths --repo $env:GITHUB_REPOSITORY --title "Codex Desktop Usage Monitor for Windows $tag" --notes-file (Join-Path $bundle 'RELEASE_NOTES.md') --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release upload failed.' }
